name: Android emulator smoke test
on:
  push:
    branches:
      - feature/android-play-store
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.dotexsolutions.akye/.MainActivity
            sleep 8
            adb shell pidof com.dotexsolutions.akye
            adb shell dumpsys activity activities | grep 'com.dotexsolutions.akye'
