name: Chromium browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/akye-browser --no-save playwright@1.58.2
          /tmp/akye-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser acceptance
        run: |
          python3 -m http.server 8765 --directory public > /tmp/akye-http.log 2>&1 &
          export NODE_PATH=/tmp/akye-browser/node_modules
          node scripts/check-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: browser-evidence/
          if-no-files-found: warn
