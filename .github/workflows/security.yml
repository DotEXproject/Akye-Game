name: Security and gameplay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:release
      - name: Validate staged account-security checks
        run: |
          node scripts/check-recovery-policy.mjs
          node scripts/check-guardian-policy.mjs
          node scripts/check-retention.mjs
