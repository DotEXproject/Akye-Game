name: Android debug build

on:
  push:
    branches:
      - feature/android-play-store
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android release configuration
        run: node android/scripts/check-release-config.mjs
      - name: Validate Android Digital Asset Links generator
        run: node android/scripts/check-assetlinks.mjs
      - name: Locate Android SDK
        run: echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Compile unsigned release App Bundle
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease
      - name: Record build provenance
        run: |
          mkdir -p android/dist
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "android_application_id=com.dotexsolutions.akye"
            echo "build_type=debug-apk-and-unsigned-release-aab"
          } > android/dist/BUILD_INFO.txt
      - name: Record APK and AAB SHA-256 checksums
        run: |
          mkdir -p android/dist
          sha256sum android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/bundle/release/*.aab > android/dist/SHA256SUMS.txt
          cat android/dist/SHA256SUMS.txt
      - name: Upload build checksums
        uses: actions/upload-artifact@v4
        with:
          name: akye-android-sha256
          path: |
            android/dist/SHA256SUMS.txt
            android/dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release AAB for validation
        uses: actions/upload-artifact@v4
        with:
          name: akye-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned-for-release debug APK
        uses: actions/upload-artifact@v4
        with:
          name: akye-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.dotexsolutions.akye/.MainActivity
            sleep 8
            adb shell pidof com.dotexsolutions.akye
